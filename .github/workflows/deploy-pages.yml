name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro, espera a que termine el que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir la carpeta del sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: sitio

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
